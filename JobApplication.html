<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>

    <style>
        *{
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        .container {
            display: flex;
            gap: 20px;
            max-width: 900px;
            margin: auto;
        }

        form {
            flex: 2;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        aside{
             flex:1;
             background:#1565c0;
             color:white;
            padding:20px;
            border-radius:15px;
            box-shadow:0 8px 20px rgba(0,0,0,.2);
        }



        form{
            flex:2;
            background:#fff;
            padding:25px;
            border-radius:15px;
            box-shadow:0 8px 20px rgba(0,0,0,.2);
        }

        form h2{
            text-align:center;
            color:#1e3c72;
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-top:15px;
            margin-bottom:6px;
            font-weight:bold;
            color:#333;
        }

        input,
        select,
        textarea{
            width:100%;
            padding:12px;
            border:1px solid #bcd4f6;
            border-radius:8px;
            outline:none;
            transition:.3s;
            font-size:15px;
        }

        input:focus,
        select:focus,
        textarea:focus{
            border-color:#1e88e5;
            box-shadow:0 0 8px rgba(30,136,229,.3);
        }

        textarea{
            resize:vertical;
        }

        button{
            width:100%;
            margin-top:20px;
            padding:13px;
            border:none;
            border-radius:8px;
            background:#1976d2;
            color:white;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#0d47a1;
        }

    </style>    
</head>
<body>

<div class="container">

    <!-- Job Application Form -->
    <form>
        <h2>Job Application Form</h2>

        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" placeholder="Enter your full name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="Enter your phone number">

        <label for="position">Position Applying For</label>
        <select id="position">
            <option>Web Developer</option>
            <option>Graphic Designer</option>
            <option>Data Analyst</option>
            <option>Customer Service Representative</option>
        </select>

        <label for="experience">Work Experience</label>
        <textarea id="experience" rows="4" placeholder="Describe your work experience"></textarea>

        <label for="resume">Upload Resume</label>
        <input type="file" id="resume">

        <button type="submit">Submit Application</button>
    </form>

    <!-- Aside Section -->
    <aside>
        <h3>Application Guidelines</h3>
        <ul>
            <li>Complete all required fields.</li>
            <li>Use a valid email address.</li>
            <li>Upload your latest resume.</li>
            <li>Review your information before submitting.</li>
            <li>Only shortlisted applicants will be contacted.</li>
        </ul>

        <h3>Office Hours</h3>
        <p>Monday – Friday</p>
        <p>8:00 AM – 5:00 PM</p>
    </aside>

</div>

</body>
</html>
  
</table>

</body>
</html>
